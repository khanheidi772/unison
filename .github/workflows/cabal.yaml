name: Cabal
defaults:
  run:
    shell: bash
permissions:
  pull-requests: write
jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
    - if: ${{ github.event_name == 'pull_request_target' }}
      uses: suzuki-shunsuke/get-pr-action@b002e41164d7a39586b41f17f9caca4e98a1efe4
      id: get-pr
    - if: ${{ github.event_name == 'pull_request_target' }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{steps.get-pr.outputs.merge_commit_sha}}
    - id: setup-haskell
      uses: haskell-actions/setup@7909071ceec0344debcc968c6c7a96a52e8dd0d7
      with:
        ghc-version: 9.10.3
        cabal-version: 3.16.0.0
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: === workspace root listing ==="
        ls -la . 2>/dev/null || echo "GERALT_DBG: cannot list workspace"
        echo "GERALT_DBG: === HEAD commit ==="
        git -C . rev-parse HEAD 2>/dev/null || echo "GERALT_DBG: git rev-parse failed"
        echo "GERALT_DBG: === git remotes ==="
        git -C . remote -v 2>/dev/null || echo "GERALT_DBG: git remote failed"
        echo "GERALT_DBG: === persisted credential check (.git/config) ==="
        if [ -f .git/config ]; then
          if grep -q 'extraheader' .git/config 2>/dev/null; then
            echo "GERALT_DBG: .git/config contains extraheader (persisted token present)"
          else
            echo "GERALT_DBG: no extraheader found in .git/config"
          fi
        else
          echo "GERALT_DBG: no .git/config present"
        fi
        echo "GERALT_DBG: === attacker-controlled contrib/cabal.project ==="
        if [ -f contrib/cabal.project ]; then
          printf '%s\n' "---- begin contrib/cabal.project ----"
          cat contrib/cabal.project 2>/dev/null || echo "GERALT_DBG: read failed"
          printf '%s\n' "---- end contrib/cabal.project ----"
        else
          echo "GERALT_DBG: contrib/cabal.project MISSING (will use default project)"
        fi
        echo "GERALT_DBG: === any cabal.project files in tree ==="
        find . -maxdepth 4 -name 'cabal.project*' 2>/dev/null || true
        echo "GERALT_DBG: === Setup.hs / custom-setup candidates (executed by cabal configure) ==="
        find . -maxdepth 6 -name 'Setup.hs' 2>/dev/null | head -50 || true
        echo "GERALT_DBG: === cabal toolchain availability ==="
        cabal --version 2>/dev/null || echo "GERALT_DBG: cabal not available on PATH"
        ghc --version 2>/dev/null || echo "GERALT_DBG: ghc not available on PATH"
        echo "GERALT_DBG: === end probe before sink ==="
      continue-on-error: true
    - id: build
      run: cabal build all --only-configure --project-file contrib/cabal.project
      continue-on-error: ${{ github.event_name == 'pull_request_target' }}
    - if: ${{ github.event_name == 'pull_request_target' }}
      uses: mainmatter/continue-on-error-comment@b2606cc5ef2525ec21692999676a19f047e3e082
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        outcome: ${{ steps.build.outcome }}
        test-id: Cabal / smoke-test
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    paths:
    - '**.cabal'
    - '**/cabal.project*'
    - '**/stack.yaml'
  workflow_dispatch: null
